<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Useful Artefacts</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0066cc;
    --border: #e2e2e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1c;
      --card-bg: #2a2a2d;
      --text: #f2f2f2;
      --muted: #a0a0a5;
      --accent: #4da3ff;
      --border: #3a3a3d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 3rem 1.5rem 1.5rem;
    text-align: center;
  }
  header h1 {
    margin: 0 0 0.5rem;
    font-size: 2.25rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem 1.5rem 4rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.25rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
  }
  .card .tag {
    align-self: flex-start;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
  }
  .card h2 {
    margin: 0;
    font-size: 1.15rem;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.4;
  }
  footer {
    text-align: center;
    padding: 2rem 1.5rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>Useful Artefacts</h1>
  <p>A growing collection of documents, decks, and tools worth keeping handy.</p>
</header>

<main>
  <div class="grid">
    <!-- Add a new <a class="card"> block here for each new artefact -->
    <a class="card" href="artefacts/from-chaos-to-clarity-data-platform/index.html">
      <span class="tag">Deck</span>
      <h2>From Chaos to Clarity</h2>
      <p>The case for a data platform.</p>
    </a>
    <a class="card" href="artefacts/oracle-goldendate-alternatives-oci/index.html">
      <span class="tag">Report</span>
      <h2>GoldenGate Alternatives</h2>
      <p>Oracle On-Prem &rarr; OCI ATP bi-directional replication options.</p>
    </a>
  </div>
</main>

<footer>
  Useful Artefacts
</footer>

</body>
</html>
